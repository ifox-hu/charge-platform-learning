services:
  mysql:
    image: mysql:8.0.30
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-charge_platform}
      MYSQL_USER: ${MYSQL_USER:-charge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-config:/etc/mysql
      - ./docs/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [charge-net]

  redis:
    image: redis:7.0.10
    pull_policy: never
    restart: unless-stopped
    init: true
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [charge-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    pull_policy: never
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: unless-stopped
    init: true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-plugins:/plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 90s
    networks: [charge-net]

  simulator-001:
    image: centos7-jdk17:latest
    pull_policy: never
    restart: unless-stopped
    volumes:
      - ./simulator/target/charge-platform-simulator-0.1.0-SNAPSHOT.jar:/app/app.jar:ro
    entrypoint: ["java", "-jar", "/app/app.jar"]
    environment:
      JAVA_TOOL_OPTIONS: "-Dsimulator.port=9100 -Dsimulator.device-id=SIM-PILE-001 -Dsimulator.connectors=2 -Dsimulator.time-scale=${SIMULATOR_TIME_SCALE:-1}"
    expose: ["9100"]
    networks: [charge-net]

  simulator-002:
    image: centos7-jdk17:latest
    pull_policy: never
    restart: unless-stopped
    volumes:
      - ./simulator/target/charge-platform-simulator-0.1.0-SNAPSHOT.jar:/app/app.jar:ro
    entrypoint: ["java", "-jar", "/app/app.jar"]
    environment:
      JAVA_TOOL_OPTIONS: "-Dsimulator.port=9100 -Dsimulator.device-id=SIM-PILE-002 -Dsimulator.connectors=2 -Dsimulator.time-scale=${SIMULATOR_TIME_SCALE:-1}"
    expose: ["9100"]
    networks: [charge-net]

  simulator-003:
    image: centos7-jdk17:latest
    pull_policy: never
    restart: unless-stopped
    volumes:
      - ./simulator/target/charge-platform-simulator-0.1.0-SNAPSHOT.jar:/app/app.jar:ro
    entrypoint: ["java", "-jar", "/app/app.jar"]
    environment:
      JAVA_TOOL_OPTIONS: "-Dsimulator.port=9100 -Dsimulator.device-id=SIM-PILE-003 -Dsimulator.connectors=4 -Dsimulator.time-scale=${SIMULATOR_TIME_SCALE:-1}"
    expose: ["9100"]
    networks: [charge-net]

  backend:
    image: centos7-jdk17:latest
    pull_policy: never
    restart: unless-stopped
    init: true
    volumes:
      - ./backend/target/charge-platform-learning-0.1.0-SNAPSHOT.jar:/app/app.jar:ro
    entrypoint: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-charge_platform}
      DB_USERNAME: ${MYSQL_USER:-charge}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      SIMULATOR_ENABLED: "true"
      SIMULATOR_SYNC_DATABASE: "true"
      SIMULATOR_DEVICES: "SIM-PILE-001@simulator-001:9100,SIM-PILE-002@simulator-002:9100,SIM-PILE-003@simulator-003:9100"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [charge-net]

  frontend:
    image: nginx:1.22.1
    pull_policy: never
    restart: unless-stopped
    init: true
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "5173:80"
      - "443:443"
    depends_on:
      backend: { condition: service_healthy }
    networks: [charge-net]

volumes:
  mysql-data:
    name: ${MYSQL_DATA_VOLUME:-charge-platform_mysql-data}
  mysql-config:
    name: ${MYSQL_CONFIG_VOLUME:-charge-platform_mysql-config}
  redis-data:
    name: ${REDIS_DATA_VOLUME:-charge-platform_redis-data}
  rabbitmq-data:
    name: ${RABBITMQ_DATA_VOLUME:-charge-platform_rabbitmq-data}
  rabbitmq-plugins:
    name: ${RABBITMQ_PLUGINS_VOLUME:-charge-platform_rabbitmq-plugins}

networks:
  charge-net:
