name: Deploy
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build artifacts
        run: |
          mvn -B -f backend/pom.xml package -DskipTests
          mvn -B -f simulator/pom.xml package -DskipTests
          npm ci --prefix frontend && npm run build --prefix frontend
      - name: Upload and restart server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" -a -n "$DEPLOY_USER" -a -n "$DEPLOY_PATH" -a -n "$DEPLOY_KEY"
          install -m 600 /dev/null deploy_key && printf '%s\n' "$DEPLOY_KEY" > deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/backend/target' '$DEPLOY_PATH/simulator/target' '$DEPLOY_PATH/frontend' '$DEPLOY_PATH/scripts'"
          rsync -az -e "ssh -i deploy_key -o StrictHostKeyChecking=no" backend/target/*.jar "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/backend/target/"
          rsync -az -e "ssh -i deploy_key -o StrictHostKeyChecking=no" simulator/target/*.jar "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/simulator/target/"
          rsync -az --delete -e "ssh -i deploy_key -o StrictHostKeyChecking=no" frontend/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/frontend/dist/"
          rsync -az -e "ssh -i deploy_key -o StrictHostKeyChecking=no" frontend/nginx.conf docker-compose.server.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          rsync -az -e "ssh -i deploy_key -o StrictHostKeyChecking=no" scripts/deploy-server.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/"
          ssh -i deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && bash scripts/deploy-server.sh"
